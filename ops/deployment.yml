apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backend-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app:  app-backend
  template:
    metadata:
      labels:
        app: app-backend
    spec:
      containers:
      - name: app-backend
        image: saksham251/app-backend:latest
        ports:
        - containerPort: 80
        env:
          - name: PORT
            valueFrom:
              configMapKeyRef:
                name: backend-config
                key: port
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: backend-secret
                key: database_url